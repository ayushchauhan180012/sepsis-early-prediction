[pytest]
testpaths = tests

# Default run excludes the opt-in PostgreSQL integration tests
# (they require an explicit TEST_DATABASE_URL, see tests/test_phase7_postgres.py).
# Run them with:  python -m pytest -m integration
addopts = -m "not integration"

markers =
    integration: PostgreSQL integration tests (opt-in via TEST_DATABASE_URL; skipped unless explicitly configured)